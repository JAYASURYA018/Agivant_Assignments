# Application Name
spring.application.name=leave-management

# Server Port
server.port=8081

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/leave_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=luffy
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DDL Initialization (Set to never for MySQL to prevent schema recreation drops)
spring.sql.init.mode=never

# Swagger UI and API Docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS Configuration
# We will define a global CORS configuration in Java to allow requests from the frontend folder.
