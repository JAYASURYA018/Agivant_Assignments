<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELM - Public Holidays</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/holidays.css">
</head>
<body>

    
    <header class="top-navbar">
        <div class="nav-links">
            <div class="elm-logo-header">ELM</div>
            <div class="nav-item" onclick="window.location.href='../index.html'">My Data</div>
            <div class="nav-item" onclick="window.location.href='employees.html'">Team</div>
            <div class="nav-item active">Holidays</div>
        </div>
        <div class="nav-actions">
            <button class="action-btn-circle" title="Search" id="nav-search-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button class="action-btn-circle" title="Notifications" id="nav-bell-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </button>
            <div class="profile-container">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100&h=100" alt="User Profile" class="avatar-img" id="avatar-img">
                <div class="profile-dropdown" id="profile-dropdown">
                    <div class="dropdown-user-name" id="dropdown-user-name">Guest Employee</div>
                    <div class="dropdown-user-email" id="dropdown-user-email">guest@example.com</div>
                    <hr class="dropdown-divider">
                    <button class="dropdown-logout-btn" id="dropdown-logout-btn">Sign Out</button>
                </div>
            </div>
        </div>
    </header>

    
    <main class="main-content" style="max-width: 1100px; padding: 24px;">
        
        
        <div class="holiday-nav-bar">
            <div class="nav-controls">
                <button class="nav-arrow-btn">‹</button>
                <button class="calendar-select-btn">
                    <svg class="calendar-icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <span id="label-date-range">01-Jan-2026 - 31-Dec-2026</span>
                </button>
                <button class="nav-arrow-btn">›</button>
            </div>

            <div class="nav-right-actions">
                <button class="view-btn active" title="List View">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                </button>
                <button class="view-btn" title="Calendar View">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </button>
                <select class="holiday-select-dropdown">
                    <option value="my-holidays">My Holidays</option>
                    <option value="all-holidays">All Holidays</option>
                </select>
                <button class="view-btn" title="Filters">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                </button>
                <button class="view-btn" title="More Options">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
                </button>
            </div>
        </div>

        
        <div class="holiday-panel">
            <table class="holiday-table">
                <thead>
                    <tr>
                        <th style="width: 40%;">Name</th>
                        <th style="width: 40%;">Date</th>
                        <th style="width: 20%;">Classification</th>
                    </tr>
                </thead>
                <tbody id="holiday-table-body">
                    <tr>
                        <td colspan="3" style="text-align: center; color: var(--text-muted); padding: 40px;">
                            Loading holiday calendar details...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/holidays.js"></script>
</body>
</html>
