<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELM - Team Leave Schedule</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/employees.css">
</head>
<body>

    
    <header class="top-navbar">
        <div class="nav-links">
            <div class="elm-logo-header">ELM</div>
            <div class="nav-item" onclick="window.location.href='../index.html'">My Data</div>
            <div class="nav-item active">Team</div>
            <div class="nav-item" onclick="window.location.href='holidays.html'">Holidays</div>
        </div>
        <div class="nav-actions">
            <button class="action-btn-circle" title="Search" id="nav-search-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button class="action-btn-circle" title="Notifications" id="nav-bell-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </button>
            <div class="profile-container">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100&h=100" alt="User Profile" class="avatar-img" id="avatar-img">
                <div class="profile-dropdown" id="profile-dropdown">
                    <div class="dropdown-user-name" id="dropdown-user-name">Guest Employee</div>
                    <div class="dropdown-user-email" id="dropdown-user-email">guest@example.com</div>
                    <hr class="dropdown-divider">
                    <button class="dropdown-logout-btn" id="dropdown-logout-btn">Sign Out</button>
                </div>
            </div>
        </div>
    </header>

    
    <nav class="sub-navbar">
        <div class="sub-item active" id="tab-on-leave">On Leave</div>
        <div class="sub-item" id="tab-all-employees">All Employees</div>
    </nav>

    
    <main class="main-content">
        
        
        <div id="on-leave-view">
            
            <div class="weekly-nav-bar">
                <div class="nav-controls">
                    <button class="nav-arrow-btn" id="btn-prev-week">‹</button>
                    <button class="calendar-select-btn" id="btn-current-range">
                        <svg class="calendar-icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        <span id="label-date-range">Calculating...</span>
                    </button>
                    <button class="nav-arrow-btn" id="btn-next-week">›</button>
                </div>

                
                <div class="nav-view-actions">
                    <button class="view-btn active" title="List View" id="btn-list-view">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    </button>
                    <button class="view-btn" title="Calendar View" id="btn-calendar-view">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    </button>
                    <button class="view-btn" title="Day View" id="btn-day-view">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    </button>
                    <button class="view-btn" title="Filter View" id="btn-filter-view">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                    </button>
                </div>
            </div>

            
            <div id="leaves-weekly-container">
                
                <div style="text-align: center; color: var(--text-muted); padding: 40px;">
                    Loading leave calendar details...
                </div>
            </div>
        </div>

        
        <div id="all-employees-view" style="display: none;">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
                <button class="apply-leave-btn" id="btn-add-employee" style="display: none; padding: 8px 16px; font-size: 13px;">Add Employee</button>
            </div>
            <div class="holiday-panel" style="border: none; box-shadow: none; background: transparent; padding: 0;">
                <table class="employee-table">
                    <thead>
                        <tr>
                            <th class="sortable" onclick="sortEmployees('id')" style="width: 10%;">ID <span id="sort-icon-id" class="sort-indicator">⇅</span></th>
                            <th class="sortable" onclick="sortEmployees('name')" style="width: 30%;">Name <span id="sort-icon-name" class="sort-indicator">⇅</span></th>
                            <th class="sortable" onclick="sortEmployees('email')" style="width: 30%;">Email <span id="sort-icon-email" class="sort-indicator">⇅</span></th>
                            <th class="sortable" onclick="sortEmployees('department')" style="width: 15%;">Department <span id="sort-icon-department" class="sort-indicator">⇅</span></th>
                            <th class="actions-header" style="width: 15%; text-align: right; padding-right: 20px; display: none;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employee-list-body">
                        <tr>
                            <td colspan="4" id="employee-colspan-td" style="text-align: center; color: var(--text-muted); padding: 40px;">
                                Fetching employee list...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    
    <div id="employee-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 20000; justify-content: center; align-items: center;">
        <div class="form-page-container" style="max-width: 600px; width: 90%; background: #ffffff; border-radius: 8px; box-shadow: var(--shadow-md); margin: 0; padding: 24px;">
            <div class="form-header" style="padding-bottom: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                <h2 class="form-title" id="employee-modal-title" style="font-size: 18px; margin: 0;">Add Employee</h2>
                <button class="close-btn" id="employee-modal-close" style="font-size: 24px; cursor: pointer; border: none; background: transparent; color: var(--text-muted);">×</button>
            </div>
            <form id="employee-form" class="form-body" style="padding: 0;" novalidate>
                <input type="hidden" id="employee-id-hidden">
                
                <div class="form-group" style="margin-bottom: 12px; display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center;">
                    <label class="form-label" for="emp-first-name" style="font-size: 13px; font-weight: 600; color: #475569; padding-top: 0;">First Name <span class="required-star">*</span></label>
                    <div class="form-input-container">
                        <input type="text" class="form-control" id="emp-first-name" placeholder="First Name" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 12px; display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center;">
                    <label class="form-label" for="emp-last-name" style="font-size: 13px; font-weight: 600; color: #475569; padding-top: 0;">Last Name <span class="required-star">*</span></label>
                    <div class="form-input-container">
                        <input type="text" class="form-control" id="emp-last-name" placeholder="Last Name" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 12px; display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center;">
                    <label class="form-label" for="emp-email" style="font-size: 13px; font-weight: 600; color: #475569; padding-top: 0;">Email Address <span class="required-star">*</span></label>
                    <div class="form-input-container">
                        <input type="email" class="form-control" id="emp-email" placeholder="name@company.com" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 12px; display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center;">
                    <label class="form-label" for="emp-password" id="emp-password-label" style="font-size: 13px; font-weight: 600; color: #475569; padding-top: 0;">Password <span class="required-star">*</span></label>
                    <div class="form-input-container">
                        <input type="password" class="form-control" id="emp-password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 12px; display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center;">
                    <label class="form-label" for="emp-department" style="font-size: 13px; font-weight: 600; color: #475569; padding-top: 0;">Department</label>
                    <div class="form-input-container">
                        <select class="form-control" id="emp-department">
                            <option value="">-- Select Department --</option>
                            <option value="Engineering">Engineering</option>
                            <option value="HR">HR</option>
                            <option value="Operations">Operations</option>
                            <option value="Sales">Sales</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Finance">Finance</option>
                            <option value="Media">Media</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 20px; display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center;">
                    <label class="form-label" for="emp-role" style="font-size: 13px; font-weight: 600; color: #475569; padding-top: 0;">Role <span class="required-star">*</span></label>
                    <div class="form-input-container">
                        <select class="form-control" id="emp-role" required>
                            <option value="EMPLOYEE">Employee</option>
                            <option value="MANAGER">Manager</option>
                        </select>
                    </div>
                </div>
            </form>
            <div class="form-footer" style="padding-top: 15px; margin-top: 15px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" class="btn btn-primary" id="btn-submit-employee" style="padding: 8px 16px;">Save</button>
                <button type="button" class="btn btn-secondary" id="btn-cancel-employee" style="padding: 8px 16px;">Cancel</button>
            </div>
        </div>
    </div>

    
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/employees.js"></script>
</body>
</html>
