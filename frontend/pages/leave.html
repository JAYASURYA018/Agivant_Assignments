<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Leave Management System - Apply Leave</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>
<body>

    
    <header class="top-navbar">
        <div class="nav-links">
            <div class="elm-logo-header">ELM</div>
            <div class="nav-item" onclick="window.location.href='../index.html'">My Data</div>
            <div class="nav-item" onclick="window.location.href='employees.html'">Team</div>
            <div class="nav-item" onclick="window.location.href='holidays.html'">Holidays</div>
        </div>
        <div class="nav-actions">
            <button class="action-btn-circle" title="Search" id="nav-search-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button class="action-btn-circle" title="Notifications" id="nav-bell-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </button>
            <div class="profile-container">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100&h=100" alt="User Profile" class="avatar-img" id="avatar-img">
                <div class="profile-dropdown" id="profile-dropdown">
                    <div class="dropdown-user-name" id="dropdown-user-name">Guest Employee</div>
                    <div class="dropdown-user-email" id="dropdown-user-email">guest@example.com</div>
                    <hr class="dropdown-divider">
                    <button class="dropdown-logout-btn" id="dropdown-logout-btn">Sign Out</button>
                </div>
            </div>
        </div>
    </header>

    
    <nav class="sub-navbar">
        <div class="sub-item" onclick="window.location.href='../index.html'">Leave Summary</div>
        <div class="sub-item" onclick="window.location.href='../index.html'">Leave Requests</div>
    </nav>

    
    <main class="main-content" style="max-width: 1000px; padding: 20px 10px;">
        
        <div class="form-page-container">
            <div class="form-header">
                <h2 class="form-title">Apply Leave</h2>
                <button class="close-btn" onclick="window.location.href='../index.html'">×</button>
            </div>
            
            <form id="leave-request-form" class="form-body" novalidate>
                <h3 class="form-section-title">Leave Details</h3>
                

                
                <div class="form-group">
                    <label class="form-label" for="leave-type">Leave type <span class="required-star">*</span></label>
                    <div class="form-input-container">
                        <select class="form-control" id="leave-type" required>
                            <option value="">Select Type</option>
                            <option value="CL">Casual Leave (CL)</option>
                            <option value="SL">Sick Leave (SL)</option>
                            <option value="EL">Earned Leave (EL)</option>
                        </select>
                        <span class="error-text" id="leave-type-error">Please select a leave type.</span>
                    </div>
                </div>

                
                <div class="form-group">
                    <label class="form-label">Date <span class="required-star">*</span></label>
                    <div class="form-input-container">
                        <div class="date-row">
                            
                            <div class="date-input-wrapper">
                                <input type="date" class="form-control" id="start-date" required>
                            </div>
                            
                            <div class="date-input-wrapper">
                                <input type="date" class="form-control" id="end-date" required>
                            </div>
                        </div>
                        <span class="error-text" id="date-error">Dates are required and start date must not be after end date.</span>
                        <div class="days-badge-container">
                            <span class="days-badge" id="days-badge">Leave Days: 0</span>
                        </div>
                    </div>
                </div>

                
                <div class="form-group">
                    <label class="form-label" for="team-email">Team Email ID</label>
                    <div class="form-input-container">
                        <input type="email" class="form-control" id="team-email" placeholder="enter team group email (optional)">
                    </div>
                </div>

                
                <div class="form-group">
                    <label class="form-label" for="reason">Reason for leave</label>
                    <div class="form-input-container">
                        <textarea class="form-control" id="reason" placeholder="enter reason for leave"></textarea>
                    </div>
                </div>

            </form>

            <div class="form-footer">
                <button type="button" class="btn btn-primary" id="btn-submit-leave">Submit</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='../index.html'">Cancel</button>
            </div>
        </div>

    </main>

    
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/leave.js"></script>
</body>
</html>
