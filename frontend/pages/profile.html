<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELM - My Profile Settings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>
<body>

    
    <header class="top-navbar">
        <div class="nav-links">
            <div class="elm-logo-header">ELM</div>
            <div class="nav-item" onclick="window.location.href='../index.html'">My Data</div>
            <div class="nav-item" onclick="window.location.href='employees.html'">Team</div>
            <div class="nav-item" onclick="window.location.href='holidays.html'">Holidays</div>
        </div>
        <div class="nav-actions">
            <button class="action-btn-circle" title="Search" id="nav-search-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button class="action-btn-circle" title="Notifications" id="nav-bell-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </button>
            <div class="profile-container">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100&h=100" alt="User Profile" class="avatar-img" id="avatar-img">
                <div class="profile-dropdown" id="profile-dropdown">
                    <div class="dropdown-user-name" id="dropdown-user-name">Guest Employee</div>
                    <div class="dropdown-user-email" id="dropdown-user-email">guest@example.com</div>
                    <hr class="dropdown-divider">
                    <button class="dropdown-logout-btn" id="dropdown-logout-btn">Sign Out</button>
                </div>
            </div>
        </div>
    </header>

    
    <nav class="sub-navbar">
        <div class="sub-item" onclick="window.location.href='../index.html'">Leave Summary</div>
        <div class="sub-item" onclick="window.location.href='../index.html'">Leave Requests</div>
    </nav>

    
    <main class="main-content" style="max-width: 800px; padding: 20px 10px;">
        
        <div class="form-page-container">
            <div class="form-header">
                <h2 class="form-title">My Profile Settings</h2>
                <button class="close-btn" onclick="window.location.href='../index.html'">×</button>
            </div>
            
            <form id="profile-settings-form" class="form-body" novalidate>
                <h3 class="form-section-title">Personal Details</h3>
                
                
                <div class="form-group">
                    <label class="form-label" for="profile-email">Email Address</label>
                    <div class="form-input-container">
                        <input type="email" class="form-control" id="profile-email" disabled style="background-color: #f1f5f9; cursor: not-allowed; color: #64748b;">
                    </div>
                </div>

                
                <div class="form-group">
                    <label class="form-label" for="profile-first-name">First Name <span class="required-star">*</span></label>
                    <div class="form-input-container">
                        <input type="text" class="form-control" id="profile-first-name" placeholder="First Name" required>
                        <span class="error-text" id="profile-first-name-error">First name is required.</span>
                    </div>
                </div>

                
                <div class="form-group">
                    <label class="form-label" for="profile-last-name">Last Name <span class="required-star">*</span></label>
                    <div class="form-input-container">
                        <input type="text" class="form-control" id="profile-last-name" placeholder="Last Name" required>
                        <span class="error-text" id="profile-last-name-error">Last name is required.</span>
                    </div>
                </div>

                <h3 class="form-section-title" style="margin-top: 30px;">Security & Password</h3>

                
                <div class="form-group">
                    <label class="form-label" for="profile-password">New Password (leave blank to keep current)</label>
                    <div class="form-input-container">
                        <input type="password" class="form-control" id="profile-password" placeholder="••••••••">
                        <span class="error-text" id="profile-password-error">Password must be at least 6 characters.</span>
                    </div>
                </div>

                
                <div class="form-group">
                    <label class="form-label" for="profile-confirm-password">Confirm Password</label>
                    <div class="form-input-container">
                        <input type="password" class="form-control" id="profile-confirm-password" placeholder="••••••••">
                        <span class="error-text" id="profile-confirm-error">Passwords must match.</span>
                    </div>
                </div>

            </form>

            <div class="form-footer">
                <button type="button" class="btn btn-primary" id="btn-submit-profile">Save Changes</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='../index.html'">Cancel</button>
            </div>
        </div>

    </main>

    
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
